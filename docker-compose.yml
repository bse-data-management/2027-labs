services:
  # JupyterLab in the same image the labs are built from. The notebooks run next
  # to the database, so they reach it as `postgres` and no database port needs
  # publishing to your laptop.
  jupyter:
    build: .
    image: labs
    command:
      - uv
      - run
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --no-browser
      - --allow-root
      # A fixed token, so the URL never changes and VS Code can connect too.
      # Without one, Jupyter blocks VS Code's POSTs with an _xsrf error.
      - --IdentityProvider.token=labs
      - --ServerApp.root_dir=/app/labs
    ports:
      # Port 8888 already in use? See the session 2 README: JUPYTER_PORT=8889 ...
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./labs:/app/labs
      - ./data:/app/data
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy


  # A browser for the database: the six tables, their columns and their
  # constraints, without typing SQL. The connection is preconfigured.
  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: labs@bse.eu
      PGADMIN_DEFAULT_PASSWORD: labs
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: labs
      POSTGRES_PASSWORD: labs
      POSTGRES_DB: labs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labs -d labs"]
      interval: 5s
      timeout: 5s
      retries: 10


  # Session 6, part B: a document database, reached from the notebook as
  # `mongodb`.
  mongodb:
    image: mongo:7


  # Session 6, part C: a PostgreSQL leader and one asynchronous follower. Both
  # keep their data in memory, so every start begins from a fresh, empty pair.
  leader:
    image: postgres:16
    environment:
      POSTGRES_USER: labs
      POSTGRES_PASSWORD: labs
      POSTGRES_DB: labs
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./labs/session-06/replication/allow_follower.sh:/docker-entrypoint-initdb.d/allow_follower.sh:ro

  follower:
    image: postgres:16
    entrypoint: ["sh", "/follow_leader.sh"]
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./labs/session-06/replication/follow_leader.sh:/follow_leader.sh:ro
    depends_on:
      - leader
