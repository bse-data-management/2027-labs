[project]
name = "data-management-labs"
version = "0.1.0"
description = "Lab code for Data Management (23D021), Barcelona School of Economics"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "psycopg[binary]>=3.2",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

# --- All three quality tools are configured here, in this one file. ---

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["labs", "scripts"]
extraPaths = ["labs/session-01"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["labs"]
