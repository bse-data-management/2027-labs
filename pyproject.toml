[project]
name = "data-management-labs"
version = "0.1.0"
description = "Lab code for Data Management (23D021), Barcelona School of Economics"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "psycopg[binary]>=3.2",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "pymongo>=4.18.3",
    "sqlalchemy>=2.1.5",
    "alembic>=1.20.0",
    "fastapi>=0.159.1",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

# --- All three quality tools are configured here, in this one file. ---

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The imports are there for the class students write in part A.
"labs/session-07/models.py" = ["F401"]
"labs/session-08/app/schemas.py" = ["F401"]

[tool.pyright]
include = ["labs", "scripts"]
extraPaths = ["labs/session-01", "labs/session-07", "labs/session-08"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["labs"]
