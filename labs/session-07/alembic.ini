# Alembic's settings for this lab. Run every alembic command from this folder, or
# pass -c with the path to this file.

[alembic]
# The migration scripts, and the folder Python imports models.py from, are both
# found relative to this file, wherever alembic is run from.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

# The compose database. Its host name, postgres, exists only inside the compose
# network, so alembic runs in the notebook container, not on your laptop.
sqlalchemy.url = postgresql+psycopg://labs:labs@postgres:5432/labs


[loggers]
keys = root,sqlalchemy,alembic,plugins

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

# Six lines of start-up chatter on every autogenerate, otherwise.
[logger_plugins]
level = WARNING
handlers =
qualname = alembic.runtime.plugins

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
